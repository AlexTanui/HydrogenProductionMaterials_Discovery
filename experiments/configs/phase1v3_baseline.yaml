name: phase1v3_baseline

# ---------------------------------------------------------------------------
# Full-scale MPNN: the backbone baseline for BLIP (Phase 2) and Phase 3,
# trained on the whole train block instead of the bake-off's 10,000 frames.
# A copy of phase1_baseline.yaml with three train: changes:
#   train_subset  10000 -> removed   all 444,074 frames of the train block
#   batch_size       32 -> 256
#   device          cpu -> cuda
# Why batch 256 at lr 5e-4: Alex's September SchNet trained well with that
# pair on this data, on the full train block (docs/alex_training_report.md).
# Everything else is phase1_baseline's: the data: and model: blocks, the
# same 5,000 val frames, both seeds, lr, epochs and patience;
# tests/ml/test_harness.py fails if that drifts. The name deliberately does
# not start with "phase1_", so benchmark.py's default Phase 1 report ignores
# this run, and it never shares a table with the bake-off runs.
# ---------------------------------------------------------------------------
data:
  dataset: md17
  molecule: ethanol
  theory: dft
  gold_path: data/gold/md17/ethanol_dft.npz   # gold only; if missing, run `python -m ml.data.preprocessing`
  cutoff_radius: 5.0          # A; each model's own cutoff must equal it (train.py checks)
  train_split: 0.8            # how the gold file's contiguous trajectory blocks were made;
  val_split: 0.1              #   the split is baked in as train/val/test_idx and never re-derived
  test_split: 0.1
  use_literature_split: false # ethanol_dft ships no literature-standard split
  num_rbf: 16                 # width of the dataset's edge_attr; no model reads it
  seed: 42                    # torch seed: initialisation and shuffle order

model:
  phase: mpnn
  hidden_channels: 128
  num_layers: 4
  num_rbf: 50

train:
  epochs: 200
  batch_size: 256
  lr: 0.0005
  energy_loss_weight: 1.0
  force_loss_weight: 100.0    # forces weighted far above energy (glossary.md section 6)
  patience: 20
  device: cuda
  # Budget: every one of the 444,074 train frames (no train_subset) and 5,000
  # of 55,509 val frames, a fixed stride with a seeded offset - the same val
  # frames as phase1_baseline. Nothing is re-split; the test split is never
  # read in training and is scored whole by ml/training/evaluate.py.
  train_subset_seed: 42
  val_subset: 5000
