# BLIP - Phase 2, NLL variant (SCRUM-31 follow-up). Same backbone, same
# data, same training budget as phase2_blip.yaml - the one and only
# difference is train_num_mc_samples below, which switches the loss from
# plain MSE on one stochastic sample to Gaussian NLL on a K-sample
# mean/variance (ml/models/blip.py, ml/training/train.py's batch_loss).
#
# Why this file exists rather than editing phase2_blip.yaml in place: the
# first real run (phase2_blip, kl_weight=0.01, train_num_mc_samples=1
# implicitly) is a committed, reported result - energy MAE 0.158, force
# MAE 0.207, but badly uncalibrated uncertainty (ECE ~0.70, Spearman
# ~0.005 on energy). This config is the test of whether NLL training
# fixes that, scored against the SAME baseline rather than overwriting it.
name: phase2_blip_nll

# ---------------------------------------------------------------------------
# Same data:/train: blocks as phase2_blip.yaml and the five Phase 1 configs,
# copied verbatim for a fair comparison. This file is not one of the six
# locked configs tests/ml/test_harness.py checks - it is a Phase 2 variant,
# not a seventh entry in that lock - but it still shouldn't drift from them
# for no reason.
# ---------------------------------------------------------------------------
data:
  dataset: md17
  molecule: ethanol
  theory: dft
  gold_path: data/gold/md17/ethanol_dft.npz   # gold only; if missing, run `python -m ml.data.preprocessing`
  cutoff_radius: 5.0          # A; each model's own cutoff must equal it (train.py checks)
  train_split: 0.8            # how the gold file's contiguous trajectory blocks were made;
  val_split: 0.1              #   the split is baked in as train/val/test_idx and never re-derived
  test_split: 0.1
  use_literature_split: false # ethanol_dft ships no literature-standard split
  num_rbf: 16                 # width of the dataset's edge_attr; no model reads it
  seed: 42                    # torch seed: initialisation and shuffle order

model:
  phase: blip
  hidden_channels: 128
  num_layers: 4
  num_rbf: 50
  # MC samples ml/training/evaluate.py draws via BLIP.predict_distribution
  # to populate ModelOutput.E_var/F_var at evaluation time. Unchanged from
  # phase2_blip.yaml - this is the eval-time sample count, not training's.
  num_mc_samples: 20
  # Bayes-by-backprop complexity cost - unchanged from phase2_blip.yaml.
  # Deliberately held fixed here so this run isolates one variable (the
  # loss function); retuning kl_weight is a separate follow-up experiment.
  kl_weight: 0.01
  # THE variable this config tests. >1 switches batch_loss to Gaussian NLL
  # on a train_num_mc_samples-sample mean/variance instead of MSE on one
  # sample - the loss that can actually reward calibrated variance. 4 is a
  # cost/quality compromise: each training step now costs ~4x the
  # forward+backward passes (and roughly 4x the memory, all K samples'
  # graphs held at once), so expect training to take roughly 4x
  # phase2_blip's ~80 minutes, not the ~20 minutes K=1 would cost.
  train_num_mc_samples: 4
  # NLL-from-scratch diverges: weight_rho starts at softplus(-5) ~= 0.0067
  # on purpose (small noise at init), so an untrained model's variance is
  # tiny while its error is not - a smoke test hit error^2/(2*var) ~= 1e8
  # before this existed. 20 epochs of plain MSE first (same as every
  # other model gets its whole run) gives the mean prediction a real
  # start before NLL - and its division by a still-small variance -
  # turns on. Not tuned; revisit if train_loss still spikes around epoch 21.
  nll_warmup_epochs: 20

train:
  epochs: 200
  batch_size: 32
  lr: 0.0005
  energy_loss_weight: 1.0
  force_loss_weight: 100.0    # forces weighted far above energy (glossary.md section 6)
  patience: 20
  device: cpu
  # Compute budget: 10,000 of 444,074 train frames and 5,000 of 55,509 val
  # frames, each a fixed stride over its block with a seeded offset, so every
  # model sees exactly the same frames. Nothing is re-split; the test split is
  # never read in training and is scored whole by ml/training/evaluate.py.
  train_subset: 10000
  train_subset_seed: 42
  val_subset: 5000
