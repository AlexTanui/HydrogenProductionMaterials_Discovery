# BLIP - Phase 2 (SCRUM-31): the Phase 1 MPNN backbone with input-dependent
# Gaussian weights. Same architecture, data and training protocol as
# phase1_baseline.yaml on purpose, so Phase 1 vs Phase 2 differ only in
# where stochasticity lives (CLAUDE.md's three-phase-plan note).
name: phase2_blip

# ---------------------------------------------------------------------------
# Locked protocol. The data: and train: blocks are byte-identical in all six
# Phase 1/2 configs (phase1_baseline, phase1_schnet, phase1_painn,
# phase1_physnet, phase1_dimenet, phase2_blip) and tests/ml/test_harness.py
# fails if they drift. Only model: differs. Change them in all six or none.
# ---------------------------------------------------------------------------
data:
  dataset: md17
  molecule: ethanol
  theory: dft
  gold_path: data/gold/md17/ethanol_dft.npz   # gold only; if missing, run `python -m ml.data.preprocessing`
  cutoff_radius: 5.0          # A; each model's own cutoff must equal it (train.py checks)
  train_split: 0.8            # how the gold file's contiguous trajectory blocks were made;
  val_split: 0.1              #   the split is baked in as train/val/test_idx and never re-derived
  test_split: 0.1
  use_literature_split: false # ethanol_dft ships no literature-standard split
  num_rbf: 16                 # width of the dataset's edge_attr; no model reads it
  seed: 42                    # torch seed: initialisation and shuffle order

model:
  phase: blip
  hidden_channels: 128
  num_layers: 4
  num_rbf: 50
  # MC samples ml/training/evaluate.py draws via BLIP.predict_distribution
  # to populate ModelOutput.E_var/F_var (ml/models/blip.py's module docstring).
  num_mc_samples: 20
  # Bayes-by-backprop complexity cost: train.py adds
  # kl_weight * model.kl_divergence() / n_batches to the loss. A starting
  # value, not a tuned one - watch train_kl/val_kl in history.csv for the
  # first real run; raise it if weight_rho drifts large (noisy energy/force
  # loss), lower it if weight_rho collapses toward its -5 init (no learned
  # uncertainty at all). Zero would train BLIP as an unregularised point
  # estimate, same risk the batch-dependence bug already showed the
  # consequence of (docs/reviews/blip-batch-dependence.md).
  kl_weight: 0.01

train:
  epochs: 200
  batch_size: 32
  lr: 0.0005
  energy_loss_weight: 1.0
  force_loss_weight: 100.0    # forces weighted far above energy (glossary.md section 6)
  patience: 20
  device: cpu
  # Compute budget: 10,000 of 444,074 train frames and 5,000 of 55,509 val
  # frames, each a fixed stride over its block with a seeded offset, so every
  # model sees exactly the same frames. Nothing is re-split; the test split is
  # never read in training and is scored whole by ml/training/evaluate.py.
  train_subset: 10000
  train_subset_seed: 42
  val_subset: 5000
