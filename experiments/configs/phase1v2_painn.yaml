# PaiNN baseline for the Phase 1 bake-off, protocol v2 (SCRUM-52, epic SCRUM-50).
#
# Schema: glossary.md section 6.
#   python -m ml.training.train    experiments/configs/phase1v2_painn.yaml
#   python -m ml.training.evaluate --checkpoint experiments/checkpoints/phase1v2_painn.pt
name: phase1v2_painn

# ---------------------------------------------------------------------------
# Phase 1 bake-off, protocol v2 (docs/phase1_protocol.md, "Protocol v2").
# A copy of phase1_painn.yaml with two train: values changed:
#   train_subset  10000 -> 111000   every 4th frame of the 444,074-frame train block
#   epochs          200 -> 50
# Why: every v1 model hit the 200-epoch cap and fitted its 10,000 frames far
# better than it generalised (val/train loss 1.2-3.5x), so v2 trains on 11x
# the frames for a quarter of the epochs.
# Everything else is v1's: the data: and model: blocks equal
# phase1_painn.yaml's, and the train: block is byte-identical in all five
# phase1v2_* configs; tests/ml/test_harness.py fails if any of that drifts.
# The name deliberately does not start with "phase1_", so benchmark.py's
# default Phase 1 report ignores these runs. v2 results go in their own table
# (reports/phase1v2_benchmark.*) and never share one with v1 or Phase 2/3.
# ---------------------------------------------------------------------------
data:
  dataset: md17
  molecule: ethanol
  theory: dft
  gold_path: data/gold/md17/ethanol_dft.npz   # gold only; if missing, run `python -m ml.data.preprocessing`
  cutoff_radius: 5.0          # A; each model's own cutoff must equal it (train.py checks)
  train_split: 0.8            # how the gold file's contiguous trajectory blocks were made;
  val_split: 0.1              #   the split is baked in as train/val/test_idx and never re-derived
  test_split: 0.1
  use_literature_split: false # ethanol_dft ships no literature-standard split
  num_rbf: 16                 # width of the dataset's edge_attr; no model reads it
  seed: 42                    # torch seed: initialisation and shuffle order

model:
  phase: painn                # ml/models/registry.py key
  hidden_channels: 128        # PaiNN's MD17 setting
  num_layers: 3               # message+update blocks
  cutoff_radius: 5.0          # must equal data.cutoff_radius
  # PaiNN's own Bessel radial basis, recomputed from `pos` inside the
  # forward pass. Deliberately separate from data.num_rbf: the dataset's
  # edge_attr is detached from pos (built via pos.numpy()), so a model that
  # read it would compute forces that are not the gradient of the energy it
  # reports. See ml/models/painn.py::predict_energy.
  num_rbf: 20
  max_atomic_number: 100
  eps: 1.0e-8                 # floor inside every vector norm

train:
  epochs: 50
  batch_size: 32
  lr: 0.0005
  energy_loss_weight: 1.0
  force_loss_weight: 100.0    # forces weighted far above energy (glossary.md section 6)
  patience: 20
  device: cpu
  # Compute budget: 111,000 of 444,074 train frames and 5,000 of 55,509 val
  # frames, each a fixed stride over its block with a seeded offset, so every
  # model sees exactly the same frames. Nothing is re-split; the test split is
  # never read in training and is scored whole by ml/training/evaluate.py.
  train_subset: 111000
  train_subset_seed: 42
  val_subset: 5000
